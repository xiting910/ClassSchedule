# =============================================================================
# Dependabot 自动依赖更新配置, 每周自动检查 NuGet 包和 GitHub Actions 是否有新版本
# =============================================================================
version: 2
updates:
  # ── NuGet 依赖更新 ───────────────────────────────────────────────────────
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "nuget"
    groups:
      # Avalonia 系列包合并更新
      avalonia:
        patterns:
          - "Avalonia*"
      # Entity Framework Core 系列包合并更新
      entity-framework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      # Microsoft.Extensions.* 系列包合并更新
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
    ignore:
      # Xamarin.AndroidX.Core.SplashScreen 1.2.0+ 与 Avalonia.Android 的 AppCompat 版本冲突
      - dependency-name: "Xamarin.AndroidX.Core.SplashScreen"

  # ── GitHub Actions 工作流依赖更新 ─────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      all-actions:
        patterns:
          - "*"
